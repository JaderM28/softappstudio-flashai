# One free web service running three processes: nginx, php-fpm and the queue
# worker. Render sells background workers as a separate paid service, but the
# container's start command is ours, so the worker simply runs here — see
# docker/supervisord.conf.
#
# Values marked sync:false are set in the Render dashboard rather than committed.

services:
  - type: web
    name: flashai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up

    envVars:
      - key: APP_NAME
        value: FlashAI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

      # php artisan key:generate --show, then paste it in the dashboard.
      # Losing it makes every encrypted value and every session unreadable.
      - key: APP_KEY
        sync: false

      # https://<service-name>.onrender.com, or the custom domain.
      - key: APP_URL
        sync: false

      # ---------------------------------------------------------- database
      # Supabase Postgres, reached through Supavisor in SESSION mode — the
      # pooler host, port 5432, user postgres.<project-ref>.
      #
      # Not the direct db.<ref>.supabase.co host, which resolves to IPv6 only.
      # Render has no IPv6 egress, so that address fails with "Network
      # unreachable" before authentication is ever attempted, and the error
      # says nothing about IPv6. The shared pooler is IPv4 on every tier.
      #
      # Session mode rather than transaction mode (port 6543): transaction mode
      # hands out a different backend per statement, which breaks the prepared
      # statements PDO issues by default.
      - key: DB_CONNECTION
        value: pgsql

      # Set as discrete values rather than a DB_URL, because a password lives
      # in the middle of a URI and any @ : / ? # in it has to be percent-encoded
      # there. Encoded wrong, the URI parses into a different host and fails
      # with an error about the wrong thing entirely. These fields have no such
      # trap. (If a URL is ever wanted instead, the key is DB_URL — not
      # DATABASE_URL, which config/database.php ignores.)
      - key: DB_HOST
        sync: false        # the pooler host, ending in .pooler.supabase.com
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false        # postgres.<project-ref>, not plain postgres
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require

      # ------------------------------------------------------------- queue
      # A database queue, not Redis: it needs no extra service, and it means a
      # job dispatched just before the free instance sleeps is still there when
      # it wakes up.
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database

      # ----------------------------------------------------------- storage
      # Supabase Storage over its S3-compatible API. Render's own disk is
      # ephemeral, so this is not optional: without it every picture and clip
      # is deleted on the next deploy.
      - key: MEDIA_DISK
        value: s3
      - key: AWS_ENDPOINT
        sync: false        # https://<project-ref>.supabase.co/storage/v1/s3
      - key: AWS_BUCKET
        sync: false

      # Uploading and serving use different URLs on Supabase, and Laravel's
      # Storage::url() has no way to know that. Without this, files upload
      # correctly and then 404 in the browser:
      #   https://<project-ref>.supabase.co/storage/v1/object/public/<bucket>
      # The bucket has to be marked public in the Supabase dashboard for that
      # path to resolve.
      - key: AWS_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false        # the region shown on the Supabase storage settings page
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: true

      # -------------------------------------------------------------- apis
      # Cloudflare Workers AI reads the cards aloud and works out where each
      # word falls inside the clip. Its REST endpoint needs no Worker deployed.
      #
      # It is the primary voice on measurements, not preference: one second
      # against Gemini's six, an MP3 already encoded rather than raw PCM that
      # needs a WAV header and ffmpeg, and about 140 notes a day inside the free
      # tier against a Gemini limit that one afternoon of testing exhausted.
      #
      # A token needs Workers AI Read and Workers AI Edit. No card required.
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false

      # One of twelve Aura voices. Chosen once: a learner should hear the same
      # voice every day, and it is part of the storage key for per-word clips,
      # so changing it later leaves the old ones behind.
      - key: CLOUDFLARE_TTS_VOICE
        value: angus

      # Gemini writes the sentences, and stays behind Cloudflare as the second
      # voice — the two are metered on unrelated counters, so the pair keeps
      # working through an afternoon either one has a bad day.
      - key: GEMINI_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: UNSPLASH_ACCESS_KEY
        sync: false

      # ffmpeg is in the image, so this is worth having on: it takes a Gemini
      # WAV from about 230 KB to about 20 KB against a 1 GB free bucket.
      # Cloudflare already answers in MP3 and passes through untouched.
      - key: FLASHAI_COMPRESS_AUDIO
        value: true

      # ---------------------------------------------------------- sessions
      # Anki's learn-ahead limit. Without it, answering "Hard" on a card being
      # drilled parks it ten minutes out and the session says there is nothing
      # left to study — which is true and is not what it means.
      - key: FLASHAI_LEARN_AHEAD_MINUTES
        value: 20

      # ------------------------------------------------------ diagnostics
      # Who may open /system, which calls the real services on a button press.
      # Left empty it falls back to the account that registered first, so this
      # only needs setting if somebody else should reach it too.
      - key: FLASHAI_DIAGNOSTICS_EMAILS
        sync: false
