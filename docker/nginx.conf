user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # Uploads are not a thing here, but Gemini's answers travel in request
    # bodies and the default 1m is uncomfortably close for a long sentence.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Writable paths, because everything else in this image is read-only to the
    # web user.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        # Render publishes whatever the container listens on; 8080 keeps this
        # off a privileged port so nginx workers need no extra capability.
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Built assets are content-hashed by Vite, so they can be cached hard.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;

            # A cold start on the free plan is slow, and a Gemini call inside a
            # request is not fast either.
            fastcgi_read_timeout 90;
        }

        # Nothing dotted is ever meant to be served, .env least of all.
        location ~ /\. {
            deny all;
        }
    }
}
