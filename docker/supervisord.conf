; Render's free plan has no background workers — they start at $7 a month — and
; every media job in this app is ShouldQueue. Rather than pay for a second
; service or give up the queue, both processes run here in the one container the
; free web service already gives us.
;
; Giving up the queue would cost more than it looks: the rate limiter, the
; release-with-backoff, and retrying a 429 but not a 401 are all queue
; machinery. Running that work synchronously would put a Gemini call and two
; image downloads inside the request the user is waiting on.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; supervisord runs as root, so its children inherit HOME=/root even when the
; program switches user — it changes the uid and not the environment. libpq
; then looks for a client certificate in $HOME/.postgresql/ on every SSL
; connection, and while it ignores that file being absent, it fails hard on it
; being unreadable. /root is 0700, so the queue worker died on every connection
; with "could not open certificate file: Permission denied" and supervisor
; restarted it in a loop.
environment=HOME="/var/www/html"

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; --max-time recycles the worker hourly so a slow leak in a long-running PHP
; process can never accumulate — this instance has 512 MB and shares it with
; php-fpm and nginx.
;
; --tries=1 because each job decides its own retry policy: FetchNoteImage
; releases a rate-limited request back onto the queue and gives up on a bad key,
; and a blanket retry here would fight that.
[program:queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=1 --max-time=3600
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
