; How many PHP processes may exist at once.
;
; The image had no pool configuration at all, which meant the php:8.4-fpm
; default: pm = dynamic with pm.max_children = 5. Beside a memory_limit of
; 256M in php.ini, that is a ceiling of 1.25 GB of PHP inside a container with
; 512 MB — and Render kills the whole container on OOM, not the process that
; asked for the memory. Nothing in this app needs five concurrent PHP workers:
; it is one person reviewing flashcards.
;
; ondemand rather than dynamic, so an idle instance holds one process instead
; of the two dynamic keeps warm. The free instance sleeps after fifteen minutes
; anyway; the saved memory is worth more than the milliseconds of warm start.

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s

; Recycle a worker after this many requests. PHP-FPM leaks slowly under any
; framework, and on a long-lived free instance that eventually matters.
pm.max_requests = 300

; Left to nginx, which already logs every request. Doubling it costs disk on a
; container whose disk is ephemeral anyway.
access.log = /dev/null

; A request that has taken this long is not going to finish. nginx gives up at
; 90s (fastcgi_read_timeout), so this sits just inside that and produces a PHP
; error with a stack trace instead of nginx's blank 504.
request_terminate_timeout = 85s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no
