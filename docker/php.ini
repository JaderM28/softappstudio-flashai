; The free instance has 512 MB shared between php-fpm, nginx and the queue
; worker, so nothing here is generous by accident.

memory_limit = 256M
max_execution_time = 90

; Gemini answers with base64 audio that is decoded in memory before it is
; written, and post_max_size caps what a form can carry back.
post_max_size = 8M
upload_max_filesize = 8M

expose_php = Off

; The code never changes inside a running container, so the validation stat on
; every request is pure waste.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16

date.timezone = UTC
